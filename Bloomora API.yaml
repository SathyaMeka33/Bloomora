  /api/surprises/:
    post:
      operationId: api_surprises_create
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/surprises/{id}/:
    get:
      operationId: api_surprises_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_surprises_create_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
