      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/surprises/{id}/checkout/:
    get:
      operationId: api_surprises_checkout_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
