      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
components:
  schemas:
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - total
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        unit_price_snapshot:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          readOnly: true
      required:
      - id
      - line_total
      - product
      - product_name
      - quantity
      - unit_price_snapshot
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Feedback:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rating:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        address_snapshot: {}
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        payment_status:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - payment_status
      - status
      - total
      - updated_at
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        price_snapshot:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - id
      - price_snapshot
      - product
      - product_name
      - quantity
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        seller_name:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        images: {}
        tags: {}
        customizable:
          type: boolean
        location:
          type: string
          maxLength: 150
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        seller:
          type: integer
          readOnly: true
        category:
          type: integer
    PatchedSeller:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        business_name:
          type: string
          maxLength: 150
        description:
          type: string
        location:
          type: string
          maxLength: 150
        approved:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        seller_name:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        images: {}
        tags: {}
        customizable:
          type: boolean
        location:
          type: string
          maxLength: 150
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        seller:
          type: integer
          readOnly: true
        category:
          type: integer
      required:
      - category
      - category_name
      - created_at
      - id
      - name
      - price
      - seller
      - seller_name
      - updated_at
    Register:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - password
    Review:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        rating:
          type: integer
          maximum: 32767
          minimum: 0
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
      - rating
      - updated_at
    RoleEnum:
      enum:
      - customer
      - seller
      - admin
      type: string
      description: |-
        * `customer` - Customer
        * `seller` - Seller
        * `admin` - Admin
    Seller:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        business_name:
          type: string
          maxLength: 150
        description:
          type: string
        location:
          type: string
          maxLength: 150
        approved:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
      required:
      - approved
      - business_name
      - created_at
      - id
      - updated_at
      - user
    StatusEnum:
      enum:
      - pending_payment
      - paid
      - processing
      - shipped
      - out_for_delivery
      - delivered
      - cancelled
      - failed
      type: string
      description: |-
        * `pending_payment` - Pending payment
        * `paid` - Paid
        * `processing` - Processing
        * `shipped` - Shipped
        * `out_for_delivery` - Out for delivery
        * `delivered` - Delivered
        * `cancelled` - Cancelled
        * `failed` - Failed
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: Registration and JWT authentication.
- name: Catalog
  description: Products and categories.
- name: Commerce
  description: Cart, checkout, and orders.
- name: Personalization
  description: Recommendations and Surprise Planner.
- name: Engagement
  description: Reviews and feedback.
